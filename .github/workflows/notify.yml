name: MAS IAL Notification

on:
  schedule:
    - cron: "0 22 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MAS IAL screening
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: python main.py

      - name: Commit snapshot updates
        run: |
          git config user.name "mas-agent-bot"
          git config user.email "mas-agent-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update MAS IAL snapshot and recipients"
          git pull --rebase
          git push
